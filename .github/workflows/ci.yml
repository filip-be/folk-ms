name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      azurite:
        # Pinned by digest; see docs/platform.
        image: mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
        ports: ["10000:10000"]
    env:
      AZURITE_BLOB_URL: http://127.0.0.1:10000/devstoreaccount1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: cms/go.sum
      - name: go.mod and go.sum are tidy and verified
        working-directory: cms
        run: go mod tidy -diff && go mod verify
      - name: Vet
        working-directory: cms
        run: go vet ./... && go vet -tags dev ./...
      - name: Test (incl. contract fixtures and Azurite adapter tests)
        working-directory: cms
        run: go test -race -count=1 ./...
      - name: govulncheck
        working-directory: cms
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Production build has no dev sign-in
        working-directory: cms
        run: |
          go build -o /tmp/cms ./cmd/cms
          ! go tool nm /tmp/cms | grep -q devoidc

  ts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bun (latest release, checksum-verified)
        run: .github/scripts/setup-bun.sh
      - name: TypeScript type-checker (the only npm package)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -b tsconfig.json
      - name: Tests (contract reader, Site routes vs config/sites.json, CSS tokens)
        run: bun test contract sites scripts
      - name: Build admin SPA and Sites
        run: |
          bun cms/admin/build.ts
          for s in $(jq -r '.organizations[].site.id' config/sites.json); do bun sites/build.ts "$s"; done

  bicep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null
