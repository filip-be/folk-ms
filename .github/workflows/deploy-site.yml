name: deploy-site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sites/**, contract/client/**, config/sites.json]

permissions:
  contents: read

jobs:
  sites:
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ids
        run: echo "ids=$(jq -c '[.organizations[].site.id]' config/sites.json)" >> "$GITHUB_OUTPUT"

  # Bun and the Site build run without an environment or OIDC token.
  build:
    needs: sites
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.ids) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bun (latest release, checksum-verified)
        run: .github/scripts/setup-bun.sh
      - name: Test routes against config/sites.json
        run: bun test sites
      - name: Build
        env:
          SNAPSHOT_URL: ${{ vars.STORAGE_PUBLIC_URL }}/sites/${{ matrix.site }}/events.json
        run: bun sites/build.ts "${{ matrix.site }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ matrix.site }}
          path: sites/${{ matrix.site }}/dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [sites, build]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.ids) }}
    concurrency: deploy-site-${{ matrix.site }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-${{ matrix.site }}
          path: dist
      - run: .github/scripts/az-login.sh
      - name: Deploy to Static Web Apps
        run: |
          rg="${{ vars.AZURE_RESOURCE_GROUP }}"
          # The app is found by the tag main.bicep sets, not by name.
          name=$(az staticwebapp list --resource-group "$rg" \
            --query "[?tags.\"folkms-site\"=='${{ matrix.site }}'].name | [0]" -o tsv)
          test -n "$name" || { echo "no Static Web App tagged folkms-site=${{ matrix.site }}"; exit 1; }
          token=$(az staticwebapp secrets list --name "$name" --resource-group "$rg" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          # The npm tool below runs with this Site's deployment token only:
          # the Azure sign-in is gone, and it cannot request the job's OIDC
          # token. Deploy-time tool only, pinned to an exact version (ADR 0003).
          az logout
          rm -rf ~/.azure
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            npx --yes @azure/static-web-apps-cli@2.1.0 deploy dist \
            --deployment-token "$token" --env production
