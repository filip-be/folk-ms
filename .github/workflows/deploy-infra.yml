name: deploy-infra

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [infra/azure/**, config/sites.json]

permissions:
  contents: read
  id-token: write

concurrency: deploy-infra

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/scripts/az-login.sh
      # main.bicep references the CMS identity as `existing`; an Owner creates
      # it in the runbook (README, First deployment step 2). Without it ARM
      # fails with a bare ResourceNotFound, so say what to do instead.
      - name: Check the CMS identity exists
        run: |
          if ! az identity show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name folkms-cms-id --output none 2>/dev/null; then
            echo "::error title=CMS identity missing::The managed identity folkms-cms-id does not exist in ${{ vars.AZURE_RESOURCE_GROUP }}. An Owner must create it and the deploy identity's role-assignment condition first: README, First deployment, step 2 (and Upgrade notes)."
            exit 1
          fi
      - name: Deploy main.bicep
        env:
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: |
          site_ids=$(jq -c '[.organizations[].site.id]' config/sites.json)
          origins=$(jq -c '[.organizations[].site.origins[]] | unique' config/sites.json)
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/azure/main.bicep \
            --parameters siteIds="$site_ids" siteOrigins="$origins" \
              cmsBaseUrl="${{ vars.CMS_BASE_URL }}" \
              googleClientId="${{ vars.GOOGLE_CLIENT_ID }}" metaAppId="${{ vars.META_APP_ID }}" \
              superAdminEmail="$SUPER_ADMIN_EMAIL" googleClientSecret="$GOOGLE_CLIENT_SECRET" \
              metaAppSecret="$META_APP_SECRET" sessionKey="$SESSION_KEY" \
            --output none
