name: deploy-infra

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [infra/azure/**, config/sites.json]

permissions:
  contents: read
  id-token: write

concurrency: deploy-infra

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The CMS identity's own resource group (ADR 0010, T4).
      IDENTITY_RG: ${{ vars.AZURE_RESOURCE_GROUP }}-identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/scripts/az-login.sh
      # main.bicep references the CMS identity as `existing`, in its own
      # resource group; an Owner creates it in the runbook (README, First
      # deployment step 2). Fail with that pointer rather than a bare ARM
      # ResourceNotFound, and refuse to deploy if this identity could change
      # the CMS identity (a federated credential would let it sign in as the
      # CMS and read page tokens: ADR 0010, T4).
      - name: Check the CMS identity
        run: |
          id=$(az identity show --resource-group "$IDENTITY_RG" --name folkms-cms-id --query id --output tsv 2>/dev/null) || {
            echo "::error title=CMS identity missing::The managed identity folkms-cms-id does not exist in the resource group $IDENTITY_RG. An Owner creates it first: README, First deployment, step 2 (and Upgrade notes)."
            exit 1
          }
          az rest --method get --url "${id}/providers/Microsoft.Authorization/permissions?api-version=2022-04-01" > perms.json
          writable=$(jq --arg a "Microsoft.ManagedIdentity/userAssignedIdentities/federatedIdentityCredentials/write" '
            def re: ascii_downcase | gsub("\\."; "\\.") | gsub("\\*"; ".*") | "^" + . + "$";
            def covers($p): ($a | ascii_downcase) | test($p | re);
            [.value[] | select(any(.actions[]; covers(.)) and (any(.notActions[]; covers(.)) | not))] | length > 0' perms.json)
          rm perms.json
          if [ "$writable" != false ]; then
            echo "::error title=CMS identity not isolated::The deploy identity can write federated credentials on folkms-cms-id. Give it only Managed Identity Operator there, and Contributor only on the app resource group: README, First deployment, step 2."
            exit 1
          fi
      - name: Deploy main.bicep
        env:
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: |
          site_ids=$(jq -c '[.organizations[].site.id]' config/sites.json)
          origins=$(jq -c '[.organizations[].site.origins[]] | unique' config/sites.json)
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/azure/main.bicep \
            --parameters siteIds="$site_ids" siteOrigins="$origins" \
              cmsBaseUrl="${{ vars.CMS_BASE_URL }}" \
              googleClientId="${{ vars.GOOGLE_CLIENT_ID }}" metaAppId="${{ vars.META_APP_ID }}" \
              superAdminEmail="$SUPER_ADMIN_EMAIL" googleClientSecret="$GOOGLE_CLIENT_SECRET" \
              metaAppSecret="$META_APP_SECRET" sessionKey="$SESSION_KEY" \
              cmsIdentityResourceGroup="$IDENTITY_RG" \
            --output none
