name: deploy-cms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cms/**, config/sites.json, contract/**]

permissions:
  contents: read
  id-token: write

concurrency: deploy-cms

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: cms/go.sum
      - name: Bun (latest release, checksum-verified)
        run: .github/scripts/setup-bun.sh
      - name: Test
        working-directory: cms
        run: go test -count=1 ./...
      - name: Package
        run: cms/deploy/package.sh
      - run: .github/scripts/az-login.sh
      - name: Deploy to Flex Consumption
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.CMS_FUNCTION_APP }}" \
            --src cms/deploy/out/cms.zip --output none
      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "${{ vars.CMS_BASE_URL }}/healthz"
