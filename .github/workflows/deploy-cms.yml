name: deploy-cms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cms/**, config/sites.json, contract/**]

permissions:
  contents: read

concurrency: deploy-cms

jobs:
  # Tests and packaging run third-party code (the Go toolchain, Bun, test
  # dependencies): this job has no environment, no secrets and no OIDC
  # token, so nothing it runs can sign in to Azure.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: cms/go.sum
      - name: Bun (latest release, checksum-verified)
        run: .github/scripts/setup-bun.sh
      - name: Test
        working-directory: cms
        run: go test -count=1 ./...
      - name: Package
        run: cms/deploy/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cms
          path: cms/deploy/out/cms.zip
          retention-days: 1
          if-no-files-found: error

  # Only Azure CLI and curl run here, on the package built above.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cms
          path: out
      - run: .github/scripts/az-login.sh
      - name: Deploy to Flex Consumption
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.CMS_FUNCTION_APP }}" \
            --src out/cms.zip --output none
      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "${{ vars.CMS_BASE_URL }}/healthz"
